name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: GITHUB_ACTIONS

jobs:
  gradle:
    name: Gradle Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', 'build-logic/src/**', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build (compile + KSP + tests + detekt + coverage gate + Manifest compatibility)
        run: ./gradlew build koverXmlReport --stacktrace

      - name: Upload coverage to Codecov
        # fork 的 PR 拿不到 CODECOV_TOKEN，跳过上报而不是让构建失败。
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          fail_ci_if_error: true
          files: ./build/reports/kover/report.xml

      - name: Smoke test (the distribution boots and serves real commands)
        run: |
          ./gradlew :blog-server:installDist --stacktrace
          cd server/build/install/blog-server
          nohup bin/blog-server > smoke.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/actuator/health | grep -q '"UP"'; then echo "healthy after ${i}s"; break; fi
            if [ "$i" = 60 ]; then cat smoke.log; exit 1; fi
            sleep 1
          done
          # 创建并提交一篇文章：等待计划跟着审核 Saga 等到审核写入快照，回答中的 ref 就是这次审核。
          curl -fsS -X POST http://localhost:8080/blog/article/smoke/create-article -H 'Content-Type: application/json' \
            -d '{"title":"Smoke","body":"The distribution boots.","slug":"smoke"}' > /dev/null
          review=$(curl -fsS -X POST http://localhost:8080/blog/article/smoke/submit-article -H 'Content-Type: application/json' \
            -H 'Wow-Wait: handled(ArticleReviewSaga.onArticleSubmitted)>snapshot' -d '{}' | jq -r .ref.id)
          curl -fsS http://localhost:8080/blog/article/smoke/state | jq -e '.state.status == "IN_REVIEW"' > /dev/null
          curl -fsS "http://localhost:8080/blog/review/${review}/state" | jq -e '.state.status == "PENDING"' > /dev/null
          # 内部命令没有公开路由；匿名调用方不是编辑，不能裁决审核。
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/blog/article/smoke/publish-article \
            -H 'Content-Type: application/json' -d '{"reviewId":"x"}')" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://localhost:8080/blog/review/${review}/approve-review" \
            -H 'Content-Type: application/json' -d '{}')" = 403
          echo "smoke test passed"

      - name: Stop server
        if: always()
        run: pkill -f me.ahoo.wow.template.server.BlogServerKt || true

      - name: Helm values check (the wow-service chart renders with the build's and the deployment's values)
        # chart 自带 values.schema.json：拼错的键、错误的类型都会让渲染失败。chart 版本即 Wow 版本。
        run: |
          ./gradlew :blog-server:generateWowHelmValues --stacktrace
          wow=$(sed -n 's/^wow = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          helm template blog oci://ghcr.io/ahoo-wang/wow-service --version "$wow" \
            -f server/build/wow/helm/values.yaml -f deploy/values.yaml > /dev/null

  integration:
    name: Integration Tests (MongoDB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', 'build-logic/src/**', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Integration tests (the service on a MongoDB replica set in a container)
        run: ./gradlew integrationTest --stacktrace

  client:
    name: Client Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.3'

      - name: Set up pnpm
        run: corepack enable && corepack prepare pnpm@9 --activate

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('client/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (read-only, no --fix)
        run: pnpm exec eslint .

      - name: Test (the generated clients are what wow-generator writes from server/manifest/baseline.json)
        run: pnpm test

      - name: Build
        run: pnpm build
