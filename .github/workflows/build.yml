name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'document/**'
  pull_request:
    paths-ignore:
      - 'document/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: GITHUB_ACTIONS

jobs:
  gradle:
    name: Gradle Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build (compile + test + detekt)
        run: ./gradlew build --stacktrace

      - name: Coverage verification (domain ≥ 80%)
        run: ./gradlew :domain:jacocoTestCoverageVerification --stacktrace

      - name: Smoke test (distribution boots and is healthy)
        run: |
          ./gradlew server:installDist --stacktrace
          cd server/build/install/server
          bin/server > smoke.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/actuator/health | grep -q '"UP"'; then
              echo "server is healthy"; kill %1; exit 0
            fi
            sleep 1
          done
          cat smoke.log; exit 1

  client:
    name: Client Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'

      - name: Set up pnpm
        run: corepack enable && corepack prepare pnpm@9 --activate

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('client/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint (read-only, no --fix)
        run: pnpm exec eslint .

      - name: Build
        run: pnpm build
