name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'document/**'
  pull_request:
    paths-ignore:
      - 'document/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: GITHUB_ACTIONS

jobs:
  gradle:
    name: Gradle Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', 'build-logic/src/**', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build (compile + test + detekt + coverage verification)
        run: ./gradlew build :code-coverage-report:koverXmlReport --stacktrace

      - name: Upload coverage to Codecov
        # fork 的 PR 拿不到 CODECOV_TOKEN，跳过上报而不是让构建失败。
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          fail_ci_if_error: true
          files: ./code-coverage-report/build/reports/kover/report.xml

      - name: Smoke test (distribution boots and is healthy)
        run: |
          ./gradlew server:installDist --stacktrace
          cd server/build/install/server
          nohup bin/server > smoke.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/actuator/health | grep -q '"UP"'; then
              echo "server is healthy"; exit 0
            fi
            sleep 1
          done
          cat smoke.log; exit 1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.2'

      - name: Client contract drift check
        # 用当前服务端的 OpenAPI 重新生成 TS client，与提交的生成代码比对，防止前后端契约漂移。
        working-directory: client
        run: |
          corepack enable && corepack prepare pnpm@9 --activate
          pnpm install --frozen-lockfile
          pnpm generate
          pnpm exec eslint src/generated --fix
          # porcelain 同时覆盖修改与新增（未跟踪）文件
          if [ -n "$(git status --porcelain -- src/generated)" ]; then
            git status --porcelain -- src/generated
            echo "::error::client/src/generated is out of date. Run the server, then 'pnpm generate && pnpm lint' in client/ and commit."
            exit 1
          fi

      - name: Stop server
        if: always()
        run: pkill -f me.ahoo.wow.template.server.ServerKt || true

  client:
    name: Client Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.2'

      - name: Set up pnpm
        run: corepack enable && corepack prepare pnpm@9 --activate

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('client/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (read-only, no --fix)
        run: pnpm exec eslint .

      - name: Build
        run: pnpm build
