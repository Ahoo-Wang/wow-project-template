# 示例：blog-service 的 MongoDB 连接（deploy/values.yaml 的 envFrom 引用它）。
# 不要把真实凭据提交到仓库：用你的密钥管理（External Secrets、Sealed Secrets 等）生成这个 Secret。
apiVersion: v1
kind: Secret
metadata:
  name: blog-service-mongo
type: Opaque
stringData:
  SPRING_MONGODB_URI: mongodb://blog:change-me@mongo-0.mongo,mongo-1.mongo,mongo-2.mongo/blog?replicaSet=rs0&w=majority
