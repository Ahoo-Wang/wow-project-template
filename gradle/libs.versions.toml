[versions]
# libraries
# Wow 10 is a pre-release line: pin the exact version, the Gradle plugins (build-logic) and every Wow module follow it.
wow = "10.0.0-beta.18"
# The train Wow 10.0.0-beta.18 is built and tested on (its gradle/libs.versions.toml).
spring-boot = "4.2.0"
cosid = "5.0.1"
cocache = "8.2.0"
cosec = "8.0.0-beta.7"
springdoc = "3.2.1"
# Spring Boot 4.2.0's Jackson 3, which Wow's codecs are compiled and tested on. swagger-core 3, which springdoc 3.2.1
# brings to the server, asks for Jackson 3.2; a Gradle `platform(...)` would let it win, so every classpath enforces this
# one (wow.kotlin-conventions). Move it with spring-boot.
jackson = "3.1.8"
# Optional ecosystem BOMs, not on the default class path.
coapi = "3.1.0"
cosky = "8.0.0-beta.10"
simba = "5.1.0"
guava = "33.7.2-jre"
kotlin-logging = "8.0.7"
# test
junit = "6.1.3"
fluent-assert = "1.3.0"
mockk = "1.14.12"
# plugins
kotlin = "2.4.21"
ksp = "2.3.14"
dokka = "2.3.0"
detekt = "1.23.8"
publish-plugin = "2.0.0"
kover = "0.9.11"
test-retry = "1.6.6"

[libraries]
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
cosid-bom = { module = "me.ahoo.cosid:cosid-bom", version.ref = "cosid" }
wow-bom = { module = "me.ahoo.wow:wow-bom", version.ref = "wow" }
coapi-bom = { module = "me.ahoo.coapi:coapi-bom", version.ref = "coapi" }
cocache-bom = { module = "me.ahoo.cocache:cocache-bom", version.ref = "cocache" }
cosec-bom = { module = "me.ahoo.cosec:cosec-bom", version.ref = "cosec" }
cosky-bom = { module = "me.ahoo.cosky:cosky-bom", version.ref = "cosky" }
simba-bom = { module = "me.ahoo.simba:simba-bom", version.ref = "simba" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
kotlin-logging = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlin-logging" }
jackson-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson" }
springdoc-bom = { module = "org.springdoc:springdoc-openapi-bom", version.ref = "springdoc" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
fluent-assert-bom = { module = "me.ahoo.test:fluent-assert-bom", version.ref = "fluent-assert" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }
# gradle plugins (build-logic)
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-allopen = { module = "org.jetbrains.kotlin:kotlin-allopen", version.ref = "kotlin" }
ksp-gradle-plugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
# me.ahoo.wow (domain), me.ahoo.wow.api (api), me.ahoo.wow.service (server)
wow-gradle-plugin = { module = "me.ahoo.wow:wow-gradle-plugin", version.ref = "wow" }
detekt-gradle-plugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
dokka-gradle-plugin = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
kover-gradle-plugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
test-retry-gradle-plugin = { module = "org.gradle:test-retry-gradle-plugin", version.ref = "test-retry" }

[plugins]
publish = { id = "io.github.gradle-nexus.publish-plugin", version.ref = "publish-plugin" }
