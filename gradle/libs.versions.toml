[versions]
# libraries
spring-boot = "4.1.1"
cosid = "3.4.1"
wow = "9.9.0"
coapi = "2.2.0"
cocache = "5.4.0"
cosec = "7.0.2"
cosky = "5.8.1"
simba = "3.1.3"
guava = "33.7.2-jre"
kotlin-logging = "8.0.4"
swagger = "2.2.55"
springdoc = "3.1.1"
# test
junit = "6.1.3"
fluent-assert = "1.2.1"
mockk = "1.14.11"
# plugins
kotlin = "2.4.21"
ksp = "2.3.12"
dokka = "2.2.0"
detekt = "1.23.8"
publish-plugin = "2.0.0"
kover = "0.9.11"
test-retry = "1.6.6"

[libraries]
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
cosid-bom = { module = "me.ahoo.cosid:cosid-bom", version.ref = "cosid" }
wow-bom = { module = "me.ahoo.wow:wow-bom", version.ref = "wow" }
coapi-bom = { module = "me.ahoo.coapi:coapi-bom", version.ref = "coapi" }
cocache-bom = { module = "me.ahoo.cocache:cocache-bom", version.ref = "cocache" }
cosec-bom = { module = "me.ahoo.cosec:cosec-bom", version.ref = "cosec" }
cosky-bom = { module = "me.ahoo.cosky:cosky-bom", version.ref = "cosky" }
simba-bom = { module = "me.ahoo.simba:simba-bom", version.ref = "simba" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
kotlin-logging = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlin-logging" }
swagger-annotations = { module = "io.swagger.core.v3:swagger-annotations", version.ref = "swagger" }
springdoc-bom = { module = "org.springdoc:springdoc-openapi-bom", version.ref = "springdoc" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
fluent-assert-bom = { module = "me.ahoo.test:fluent-assert-bom", version.ref = "fluent-assert" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }
# gradle plugins (build-logic)
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-allopen = { module = "org.jetbrains.kotlin:kotlin-allopen", version.ref = "kotlin" }
ksp-gradle-plugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
detekt-gradle-plugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
dokka-gradle-plugin = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
kover-gradle-plugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
test-retry-gradle-plugin = { module = "org.gradle:test-retry-gradle-plugin", version.ref = "test-retry" }

[plugins]
publish = { id = "io.github.gradle-nexus.publish-plugin", version.ref = "publish-plugin" }
