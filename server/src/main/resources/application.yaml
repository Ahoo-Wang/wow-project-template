# 基线配置（随 jar 发布）。环境差异通过发布包 config/application.yaml 或环境变量覆盖。
management:
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
spring:
  application:
    # 运行时服务名的唯一来源；需与 DemoService.SERVICE_NAME 保持一致（CoApi 服务发现依赖该名称）。
    name: demo-service
  jackson:
    mapper:
      accept-case-insensitive-enums: true
    datatype:
      datetime:
        write-durations-as-timestamps: true
        write-dates-as-timestamps: true
cosid:
  machine:
    enabled: true
    distributor:
      type: manual
      manual:
        machine-id: 1
  generator:
    enabled: true
wow:
  kafka:
    enabled: false
  command:
    bus:
      type: in_memory
  event:
    bus:
      type: in_memory
  eventsourcing:
    store:
      storage: in_memory
    snapshot:
      storage: in_memory
    state:
      bus:
        type: in_memory
---
# 本地开发：--spring.profiles.active=dev
spring:
  config:
    activate:
      on-profile: dev
management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: "*"
springdoc:
  show-actuator: true
logging:
  level:
    me.ahoo.wow: debug
