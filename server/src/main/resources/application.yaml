# 基线配置（随 jar 发布）。环境差异由 profile、发行版的 config/application.yaml、环境变量或 Helm values 覆盖。
# Wow 在启动时校验每个 wow.* 键：拼错或已移除的键会让启动失败，而不是被静默忽略。
spring:
  application:
    # 服务名：必须等于 domain 模块的 `wow { service = "blog-service" }`；Helm chart 以它命名所有对象。
    name: blog-service
management:
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
blog:
  review:
    # 审核从开启到过期的时长。
    timeout: 7d
wow:
  # 只在 cosec profile 下启用 CoSec（见下）。
  cosec:
    mode: disabled
---
# 本机运行（Spring Boot 未检测到云平台）：内部端口只绑定回环地址。
# 没有配置后端时，节点因此以内存保存数据；没有 CallerResolver 时，以匿名调用方提供服务。
# 在 Kubernetes 上本文档不生效：Helm chart 把内部端口绑到 Pod 地址，节点必须有后端（mongo）与调用方认证（cosec）。
spring:
  config:
    activate:
      on-cloud-platform: none
wow:
  internal:
    host: 127.0.0.1
---
# 本地开发：`./gradlew :blog-server:run` 自动启用。
# 调用方由开发身份请求头声明：Wow-User（subject）、Wow-Owner（作者以自己为 owner）、Wow-Roles（如 editor）。
spring:
  config:
    activate:
      on-profile: dev
management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: "*"
springdoc:
  show-actuator: true
logging:
  level:
    me.ahoo.wow: debug
---
# MongoDB 副本集（Wow 推荐的默认存储）：宿主由 URI 创建客户端，日志、快照、预留与定时都在本服务自己的数据库里。
# 生产环境的 URI 来自 Secret（SPRING_MONGODB_URI），见 deploy/values.yaml。
spring:
  config:
    activate:
      on-profile: mongo
  mongodb:
    uri: mongodb://localhost:27017/?replicaSet=rs0
wow:
  mongo:
    database: blog
---
# 在 CoSec 网关之后：网关验证每个请求的令牌并做出决策，再以 CoSec-Identity 请求头转发它验证过的主体；
# 本服务读取该请求头作为调用方，不持有任何密钥。服务信任任何 CoSec-Identity，因此只能让网关访问公开端口
# （Helm chart 的 NetworkPolicy，以及 chart 设置的 COSEC_PIPELINE_IDENTITY_ONLYGATEWAYCANREACH）。
spring:
  config:
    activate:
      on-profile: cosec
wow:
  cosec:
    mode: gateway
    # 编辑是租户级调用方：没有 owner，能读到租户内的所有文章。其他主体都是作者，只触及自己的文章。
    tenant-level:
      roles: editor
